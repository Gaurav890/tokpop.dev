name: Publish collector

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'collector-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify release version
        working-directory: packages/cli
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); const expected='collector-v'+p.version; if(process.env.RELEASE_TAG!==expected){console.error('Expected tag '+expected); process.exit(1)}"
      - name: Inspect package contents
        working-directory: packages/cli
        run: npm pack --dry-run
      - name: Publish package
        working-directory: packages/cli
        run: npm publish --access public
